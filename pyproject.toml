[tool.poetry]
name = "gnn_scheduler"
version = "0.1.0"
description = "Job-Shop Scheduling Problem (JSSP) with Graph Neural Networks (GNNs)."
authors = ["NavidCOSMC <amir.navid.rahimi@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.25.0"
matplotlib = "^3.8.1"
ipykernel = "^6.26.0"
pandas = "^2.1.3"
python-dotenv = "^1.0.0"
omegaconf = "^2.3.0"
job-shop-lib = { git = "https://github.com/NavidCOMSC/job_shop_lib.git", branch = "develop" }
tqdm = "^4.67.1"
wandb = "^0.19.8"
types-tqdm = "^4.67.0.20250301"
gymnasium = "^1.0.0a1"
torch = { version = "^2.2.0", extras = ["cu121"] }
torch-geometric = { version = "^2.4.0", extras = ["cu121"] }

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pylint = "^3.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79
